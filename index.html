<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10131a" />
    <meta name="description" content="QuestHabit — turn your daily habits into an RPG adventure. Complete quests, level up, defeat bosses. 100% offline." />
    <title>QuestHabit</title>
    <script>
      // Visible error overlay: if the app bundle fails to parse or run
      // (old WebView, storage failure, etc.) show the reason on screen
      // instead of a blank/white page.
      (function () {
        function showError(msg) {
          try {
            var host = document.getElementById('app');
            if (host && host.dataset.errorShown) return;
            if (host) host.dataset.errorShown = '1';
            var el = document.createElement('div');
            el.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#10131a;color:#fff;font-family:system-ui;padding:24px;text-align:center;';
            el.innerHTML = '<div><div style="font-size:40px;margin-bottom:12px">⚠️</div><h2 style="margin:0 0 8px">QuestHabit could not start</h2><p style="opacity:.8;font-size:14px;max-width:340px;white-space:pre-wrap">' +
              String(msg).slice(0, 400) +
              '</p><p style="opacity:.5;font-size:12px;margin-top:12px">Please screenshot this and send it to the developer.</p><button onclick="location.reload()" style="margin-top:16px;padding:12px 24px;border-radius:999px;border:none;background:#4ade80;color:#052e16;font-weight:700">Reload</button></div>';
            (host || document.body).appendChild(el);
          } catch (e) { /* last resort: do nothing */ }
        }
        window.addEventListener('error', function (e) { showError(e.message || 'Script error'); });
        window.addEventListener('unhandledrejection', function (e) { showError(e.reason && e.reason.message ? e.reason.message : 'Unexpected error'); });
      })();
    </script>
  </head>
  <body>
    <div id="app" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
