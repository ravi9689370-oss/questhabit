name: Build Android APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci || npm install
      - run: npm run build
      # android/ platform is committed to the repo, so just sync
      # (copies the web build into android/app/src/main/assets)
      - run: npx cap sync android
      # adaptive launcher icons for every density
      - run: node scripts/generate-icons.mjs
      # Ephemeral test keystore: the release signingConfig needs a
      # real keystore file. A fresh runner has no ~/.android/debug.keystore
      # yet, so generate one with keytool. This is a THROWAWAY test
      # key — for production, generate your own persistent keystore and
      # keep it safe (losing it blocks app updates forever).
      - name: Generate CI test keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/ci-test.keystore \
            -alias ci-test \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass questhabit -keypass questhabit \
            -dname "CN=QuestHabit, O=QuestHabit, C=IN"
          cat > android/key.properties <<EOF
          STORE_FILE=ci-test.keystore
          STORE_PASSWORD=questhabit
          KEY_ALIAS=ci-test
          KEY_PASSWORD=questhabit
          EOF
      # Capacitor 8.x requires JDK 21 (its libraries compile with
      # sourceCompatibility 21; JDK 17 fails with "invalid source release: 21")
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-
      - working-directory: android
        run: |
          chmod +x ./gradlew
          # Debug APK (installable test build) + Release APK
          ./gradlew assembleDebug assembleRelease --stacktrace
      - run: ls -lh android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/release/app-release.apk
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      # Raw APK (no zip wrapper) via GitHub Release — one-tap install
      - name: Attach debug APK to Release
        uses: ncipollo/release-action@v1.14.0
        with:
          tag: debug-apk
          name: Debug APK (latest)
          body: Latest debug build. Download app-debug.apk directly, then allow "install from unknown sources" on your phone.
          artifacts: android/app/build/outputs/apk/debug/app-debug.apk
          allowUpdates: true
          artifactErrorsFailBuild: false
          token: ${{ secrets.GITHUB_TOKEN }}
